<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAP — Mensajes</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Montserrat:wght@400;600&family=Poppins:wght@300;400;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../brand.css" />
  <link rel="stylesheet" href="./webinars-style.css" />
</head>
<body class="map-body map-webinars-body" data-shell="app" data-webinars-view="form-messages">
  <header class="map-header">
    <div class="logo">
      <a href="../../index.html" class="map-logo-link" aria-label="MAP — Inicio">
        <img src="../../img/MAP Logo.png" alt="MAP" class="map-logo-img" />
      </a>
    </div>
    <nav id="nav-modules" class="map-nav-modules" aria-label="Módulos"></nav>
    <div id="user-profile"></div>
  </header>

  <main class="main-container webinars-main">
    <section id="webinars-access-guard" class="webinars-guard">
      <h2>Validando acceso</h2>
      <p>Comprobando permisos…</p>
    </section>

    <section id="webinars-form-msg-panel" class="webinars-panel" hidden>
      <div class="webinars-entries-toolbar">
        <div id="webinars-short-nav-mount" class="webinars-entries-toolbar__left webinars-short-nav-row" aria-label="Secciones"></div>
      </div>
      <div class="webinars-hero" style="margin-bottom: 1rem;">
        <div>
          <p class="webinars-eyebrow">Mensajes</p>
          <h1 id="form-msg-title" class="webinars-builder-title">Mensajes</h1>
        </div>
        <button type="button" id="btn-form-msg-add" class="btn-map-secondary webinars-new-cta--prominent">
          + Nuevo mensaje
        </button>
      </div>
      <p id="form-msg-status" class="webinars-dashboard-status" role="status" hidden></p>
      <div id="form-msg-list-mount"></div>
    </section>
  </main>

  <script type="module" src="./logic-admin.js"></script>
</body>
</html>
